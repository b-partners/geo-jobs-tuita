AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: geo-jobs-tuita - Computation and API

Globals:
  Function:
    CodeUri: .
    Runtime: java21
    Tracing: Active
    Architectures:
      - arm64
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    VpcConfig:
      SecurityGroupIds:
        - !Sub '{{resolve:ssm:/bpartners-imagery/sg/id}}'
      SubnetIds:
        - !Sub '{{resolve:ssm:/bpartners-imagery/private/subnet1/id}}'
        - !Sub '{{resolve:ssm:/bpartners-imagery/private/subnet2/id}}'
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_S3_BUCKET: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/s3/bucket-name}}'
        AWS_SES_SOURCE: lou@bpartners.app
        AWS_EVENTBRIDGE_BUS: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/eventbridge/bus-name}}'
        AWS_EVENT_STACK_1_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/1/sqs/mailbox-queue-url}}'
        AWS_EVENT_STACK_2_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/2/sqs/mailbox-queue-url}}'
        
        
        SENTRY_DSN: !Sub '{{resolve:ssm:/geo-jobs-tuita/sentry/dsn}}'
        SENTRY_ENVIRONMENT: !Ref Env
        TILES_DOWNLOADER_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles/downloader/url}}'
        TILE_DETECTION_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles/detection/url}}'
        TILE_DETECTION_API_URLS: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles/detection/urls}}'
        ADMIN_API_KEY: !Sub '{{resolve:ssm:/bpartners-geo-jobs/${Env}/admin/api-key}}'
        ANNOTATOR_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/annotator/url}}'
        ANNOTATOR_API_KEY: !Sub '{{resolve:ssm:/geo-jobs/${Env}/annotator/api/key}}'
        ANNOTATOR_GEOJOBS_USER_INFO: !Sub '{{resolve:ssm:/geo-jobs/${Env}/annotator/user/info}}'
        TILES_DOWNLOADER_MOCK_ACTIVATED: !Sub '{{resolve:ssm:/geo-jobs/${Env}/tiles-downloader-activated}}'
        OBJECTS_DETECTOR_MOCK_ACTIVATED: !Sub '{{resolve:ssm:/geo-jobs/${Env}/objects-detector-activated}}'
        SPRING_DATASOURCE_URL: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/db/url}}'
        SPRING_DATASOURCE_USERNAME: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/db/username}}'
        SPRING_DATASOURCE_PASSWORD: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/db/password}}'
        README_MONITOR_IS_DEVELOPMENT: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/monitor/is-development}}'
        README_MONITOR_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/monitor/url}}'
        README_MONITOR_API_KEY: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/monitor/apikey}}'
        ADMIN_EMAIL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/admin/email}}'
        README_WEBHOOK_SECRET: !Sub '{{resolve:ssm:/geo-jobs/${Env}/readme/webhook/secret}}'
        BPARTNERS_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/bpartners/api/url}}'
        GEOSERVER_API_URL: !Sub '{{resolve:ssm:/geo-jobs/${Env}/geoserver/api/url}}'
    
        

Parameters:
  Env:
    Type: String


Resources:
  FrontalServerlessHttpApi:
    StageName: $default
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowOrigins:
          - "*"
  
  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FrontalServerlessHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "${FrontalFunction.Arn}:live"
      PayloadFormatVersion: "1.0"
      IntegrationMethod: ANY
      TimeoutInMillis: 30000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FrontalServerlessHttpApi
      RouteKey: $default
      Target: !Sub "integrations/${HttpApiIntegration}"

  FrontalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.ApiEventHandler::handleRequest
      MemorySize: 2048
      Timeout: 300
      Role: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/execution/role-arn}}'
      Events:
        ApiCall:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId:
              Ref: FrontalServerlessHttpApi

  WorkerFunction1:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.MailboxEventHandler::handleRequest
      MemorySize: 1024
      Timeout: 900 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/execution/role-arn}}'
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/1/sqs/mailbox-queue-arn}}'
            BatchSize: 5
      ReservedConcurrentExecutions: 2

  WorkerFunction2:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.bpartners.geojobs.handler.MailboxEventHandler::handleRequest
      MemorySize: 1024
      Timeout: 900 #note(sqs-visibility)
      Role: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/execution/role-arn}}'
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/geo-jobs-tuita/${Env}/2/sqs/mailbox-queue-arn}}'
            BatchSize: 5
      ReservedConcurrentExecutions: 2

  ApiUrlSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ '', [ /geo-jobs-tuita/, !Ref Env, /api/url ] ]
      Type: String
      Value: !GetAtt FrontalServerlessHttpApi.ApiEndpoint
  
  
Outputs:
  ApiUrl:
    Description: Url to access the frontal function
    Value: !GetAtt FrontalServerlessHttpApi.ApiEndpoint
                        